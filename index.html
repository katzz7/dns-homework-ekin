<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şerife Ekin Tamtı - Bilgisayar Ağları</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(120deg, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 85%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            border: 2px solid #ffffff;
        }
        .header {
            color: #6a11cb;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
            border-bottom: 2px solid #2575fc;
            padding-bottom: 5px;
        }
        h1 {
            color: #2f3542;
            font-size: 28px;
            margin: 0 0 15px 0;
        }
        p {
            color: #57606f;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .dns-records {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .record {
            background: #f1f2f6;
            color: #2f3542;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: transform 0.2s;
        }
        .record:hover {
            transform: scale(1.05);
            background: #dfe4ea;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="header">Bilgisayar Ağları Laboratuvarı</div>
        <h1>Şerife Ekin Tamtı</h1>
        <p>
            Bu proje, internetin temel taşlarından biri olan DNS (Domain Name System) 
            altyapısının nasıl çalıştığını göstermek ve web barındırma süreçlerini 
            uygulamalı olarak test etmek için tasarlanmıştır.
        </p>
        <div class="dns-records">
            <div class="record">A Kaydı</div>
            <div class="record">CNAME Kaydı</div>
            <div class="record">MX Kaydı</div>
            <div class="record">NS Kaydı</div>
        </div>
    </div>
</body>
    
</html>
